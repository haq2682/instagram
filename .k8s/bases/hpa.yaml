apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: instagram-clone-frontend-hpa
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: instagram-clone-frontend-deployment
  # Pinned at 1 to match the backend HPA (see its comment) and keep ingress
  # -> frontend pod routing single-hop, so it can't reintroduce multi-pod
  # session routing issues for /socket.io/ proxied through this nginx.
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
        
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: instagram-clone-backend-hpa
  namespace: dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: instagram-clone-backend-deployment
  # Pinned at 1: Socket.IO keeps session state in-memory per pod, so more than
  # one backend replica breaks realtime connections without a shared (e.g.
  # Redis) adapter. Raise this again once that's added.
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
        
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70